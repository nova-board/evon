<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evon Realtime Board</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
      }

      .toolbar {
        margin-bottom: 12px;
      }

      #board {
        position: relative;
        width: 900px;
        height: 520px;
        border: 1px solid #ccc;
        background: #fff;
        overflow: hidden;
      }

      .box {
        position: absolute;
        width: 120px;
        height: 70px;
        border-radius: 8px;
        border: 1px solid #666;
        background: #d7ecff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="create-box-btn" type="button">Create box</button>
    </div>
    <div id="board"></div>

    <script src="./main.js"></script>
  </body>
</html>
